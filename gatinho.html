<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatinho Fofo!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        
        .btn-iniciar {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #ff0000;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

       
        #jumpscare-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
        }

        
        #jumpscare-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    
    <button class="btn-iniciar" id="btnIniciar">Clique para ver um gato</button>

    
    <div id="jumpscare-container">
        
        <img src="miaumiau.jpg" alt="gatinho">
    </div>
    

    <audio id="somGato" src="Miau.mp3" preload="auto"></audio>

    <script>
        const btnIniciar = document.getElementById('btnIniciar');
        const jumpscareContainer = document.getElementById('jumpscare-container');
        const somGato = document.getElementById('somGato');
        
        btnIniciar.addEventListener('click', () => {
            
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) { /* Firefox */
                document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) { /* Chrome, Safari e Opera */
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) { /* IE/Edge */
                document.documentElement.msRequestFullscreen();
            }

            
            btnIniciar.style.display = 'none';

            
            setTimeout(() => {
                jumpscareContainer.style.display = 'block';
                
            
                somGato.play();
            }, 3000); 
        });
    </script>

</body>
</html>
